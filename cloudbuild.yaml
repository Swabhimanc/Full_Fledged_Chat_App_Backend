steps:
  # Step 1: Build the Maven project
  - name: 'maven:3.8.3-openjdk-17'
    entrypoint: 'sh'
    args:
      - '-c'
      - './mvnw clean package'

  # Step 2: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/beaming-age-431614-v4/full-fledged-chat-app-backend:latest'
      - '.'

  # Step 3: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/beaming-age-431614-v4/full-fledged-chat-app-backend:latest'

  # Step 4: Deploy the Docker image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'connecto'
      - '--image'
      - 'gcr.io/beaming-age-431614-v4/full-fledged-chat-app-backend:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'lead-editor@beaming-age-431614-v4.iam.gserviceaccount.com'
      - '--memory'
      - '1Gi'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'JWT_SECRET=$_JWT_SECRET,FRONTEND_URL=$_FRONTEND_URL,ALLOWED_ORIGINS=$_ALLOWED_ORIGINS,COOKIE_SECURE=$_COOKIE_SECURE,COOKIE_SAME_SITE=$_COOKIE_SAME_SITE'
    timeout: '600s'

images:
  - 'gcr.io/beaming-age-431614-v4/full-fledged-chat-app-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
