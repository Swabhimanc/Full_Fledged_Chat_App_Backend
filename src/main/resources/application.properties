spring.application.name=ConnectO
spring.config.import=optional:file:.env[.properties]
server.port=5000
jwt.secret=${JWT_SECRET}
spring.mvc.static-path-pattern=/**
spring.resources.static-locations=classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
google.client.id=396305485425-mpcokgsdtmj2btjntgh7hp1p1cbbu6po.apps.googleusercontent.com
socket-io-host=0.0.0.0
socket-io-port=5001
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.migrations.direct-messages-enabled=${DIRECT_MESSAGE_MIGRATION_ENABLED:false}
